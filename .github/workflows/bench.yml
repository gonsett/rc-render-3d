name: bench
on: [workflow_dispatch, push]
jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        motor: [cyc32, eevee]
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: |
          curl -sL https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz | tar xJ
          sudo apt-get -qq update && sudo apt-get -qq install -y libegl1 libgl1 libxkbcommon0 libsm6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libegl-mesa0 libgl1-mesa-dri xvfb > /dev/null
          nproc; free -g
      - name: Render
        run: |
          set -o pipefail
          xvfb-run -s "-screen 0 1920x1080x24" ./blender-4.5.9-linux-x64/blender -b tomi.blend -P bench.py -- ${{ matrix.motor }} "$PWD/out_${{ matrix.motor }}.png" 2>&1 | grep -E "TIEMPO|rror|GPU|OpenGL|Mesa" | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.motor }}
          path: out_*.png
