name: fotos
# Capturas fijas en Cycles: cada foto se parte en franjas (ver.py) que corren en paralelo.
on:
  workflow_dispatch:
    inputs:
      archivo: {default: "v4.blend"}
      modos: {default: '["cara","cara34"]'}
      franjas: {default: '[0,1,2,3,4,5]'}
      n: {default: "6"}
      ancho: {default: "1080"}
      alto: {default: "1350"}
      muestras: {default: "256"}
jobs:
  franja:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        modo: ${{ fromJSON(inputs.modos) }}
        f: ${{ fromJSON(inputs.franjas) }}
    steps:
      - uses: actions/checkout@v4
      - name: Blender
        run: curl -sL https://download.blender.org/release/Blender4.5/blender-4.5.9-linux-x64.tar.xz | tar xJ
      - name: Render
        run: |
          mkdir -p out; T=$(date +%s)
          ./blender-4.5.9-linux-x64/blender -b ${{ inputs.archivo }} -P ver.py -- ${{ matrix.modo }} "$PWD/out/${{ matrix.modo }}_${{ matrix.f }}.png" ${{ inputs.ancho }} ${{ inputs.alto }} ${{ inputs.muestras }} ${{ matrix.f }} ${{ inputs.n }} 2>&1 | grep -E "Saved|rror"
          echo "SEGUNDOS $(( $(date +%s) - T ))"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.modo }}-${{ matrix.f }}
          path: out/*.png
